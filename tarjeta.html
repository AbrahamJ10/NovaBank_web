<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaBank — Mi tarjeta</title>
<link rel="icon" href="img/logo-banco.png" />
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
<div class="app-shell" id="app"></div>

<template id="tpl-tarjeta">
  <div class="grid-2">
    <section>
      <div class="tarjeta-visual" id="tarjeta-visual">
        <div class="fila entre">
          <img src="img/logo-banco.png" alt="" style="height:22px;filter:brightness(0) invert(1);opacity:.9" />
          <span class="insignia insignia-dorado" id="tarjeta-tipo">Crédito</span>
        </div>
        <div class="num" id="tarjeta-numero">•••• •••• •••• ••••</div>
        <div class="pie">
          <div><span class="k">Titular</span><span class="v" id="tarjeta-titular">—</span></div>
          <div><span class="k">Vence</span><span class="v" id="tarjeta-vence">—</span></div>
        </div>
      </div>

      <section class="card card-pad" style="margin-top:20px">
        <div class="fila entre" style="margin-bottom:4px">
          <div>
            <div style="font-family:var(--f-heading);font-weight:700;font-size:14px">Bloquear tarjeta</div>
            <div style="font-size:12px;color:var(--ink-faint);margin-top:2px">Desactiva todos los consumos al instante</div>
          </div>
          <label class="interruptor">
            <input type="checkbox" id="switch-bloqueo" />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <section class="card card-pad" style="margin-top:20px">
        <div style="font-family:var(--f-heading);font-weight:700;font-size:14px;margin-bottom:14px">Ver CVV</div>
        <button class="btn btn-linea btn-block" id="btn-ver-cvv">Solicitar código de seguridad</button>
      </section>
    </section>

    <section class="card card-pad">
      <div class="seccion-titulo"><h3>Estado de cuenta</h3></div>
      <div id="resumen-cuenta" style="display:flex;flex-direction:column;gap:14px"></div>
      <div class="divisor" style="margin:20px 0"></div>
      <div style="font-family:var(--f-heading);font-weight:700;font-size:14px;margin-bottom:14px">Pagar tarjeta</div>
      <div class="campo" style="margin-bottom:14px">
        <label>Monto a pagar</label>
        <div class="campo-caja"><span style="color:var(--gold-soft);font-weight:700">S/</span><input id="monto-pago" type="number" min="1" step="0.01" placeholder="0.00" /></div>
      </div>
      <button class="btn btn-dorado btn-block" id="btn-pagar">Pagar ahora</button>
    </section>
  </div>
</template>

<!-- Modal OTP CVV -->
<div class="modal-fondo oculto" id="modal-otp">
  <div class="card modal" style="position:relative;text-align:center">
    <span class="modal-cerrar" id="cerrar-otp" data-icon="x"></span>
    <div style="width:56px;height:56px;border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:rgba(201,162,39,.12);color:var(--gold-soft)">
      <span data-icon="lock" data-size="26"></span>
    </div>
    <h2 style="font-size:19px">Verifica tu identidad</h2>
    <p style="color:var(--ink-faint);font-size:13px;margin-top:8px">Enviamos un código a tu correo para mostrarte el CVV.</p>
    <div class="otp-caja" id="otp-cajas"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <input id="otp-input" maxlength="6" inputmode="numeric" style="position:absolute;opacity:0;pointer-events:none" />
    <span class="campo-error oculto" id="otp-error" style="display:block;margin-bottom:10px"></span>
    <div id="cvv-resultado" class="oculto" style="font-family:var(--f-display);font-size:38px;font-weight:700;color:var(--gold-soft);letter-spacing:.1em;margin-bottom:16px"></div>
    <button class="btn btn-dorado btn-block" id="btn-confirmar-otp">Confirmar</button>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/tarjeta.js"></script>
</body>
</html>
