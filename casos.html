<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaBank Admin — Casos de seguridad</title>
<meta name="theme-color" content="#080F17" />
<link rel="icon" href="img/logo-banco.png" />
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
<div class="app-shell" id="app"></div>

<template id="tpl-casos">
  <section class="card card-pad reveal reveal-1">
    <div class="filtros-barra">
      <div class="campo-caja" style="max-width:280px;flex:1">
        <span data-icon="search"></span>
        <input id="buscar" type="text" placeholder="Buscar por cliente…" />
      </div>
      <select class="select-filtro" id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="ABIERTO">Abiertos</option>
        <option value="EN_REVISION">En revisión</option>
        <option value="CERRADO">Cerrados</option>
      </select>
      <select class="select-filtro" id="filtro-prioridad">
        <option value="">Todas las prioridades</option>
        <option value="ALTA">Alta</option>
        <option value="MEDIA">Media</option>
        <option value="BAJA">Baja</option>
      </select>
    </div>

    <div class="tabla-envoltorio">
      <table class="tabla">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Categoría</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Asignado a</th>
            <th>Abierto</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-casos"></tbody>
      </table>
    </div>
    <div id="paginacion-host"></div>
  </section>
</template>

<!-- Modal detalle / actualizar caso -->
<div class="modal-fondo oculto" id="modal-caso">
  <div class="card modal" style="position:relative;max-width:480px">
    <span class="modal-cerrar" id="cerrar-modal-caso" data-icon="x" style="cursor:pointer"></span>
    <div id="detalle-caso-host"></div>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/casos.js"></script>
</body>
</html>
