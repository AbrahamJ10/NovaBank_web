<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaBank Admin — Usuarios</title>
<meta name="theme-color" content="#080F17" />
<link rel="icon" href="img/logo-banco.png" />
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
<div class="app-shell" id="app"></div>

<template id="tpl-usuarios">
  <section class="card card-pad reveal reveal-1">
    <div class="filtros-barra">
      <div class="campo-caja" style="max-width:300px;flex:1">
        <span data-icon="search"></span>
        <input id="buscar" type="text" placeholder="Buscar por nombre, correo, DNI o teléfono…" />
      </div>
      <select class="select-filtro" id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="activos">Activos</option>
        <option value="suspendidos">Suspendidos</option>
        <option value="bloqueados">Bloqueados por intentos</option>
        <option value="eliminados">Eliminados</option>
      </select>
      <button class="btn btn-fantasma btn-sm btn-filtros-avanzados" id="btn-toggle-avanzados">
        Filtros avanzados <span data-icon="chevron" data-size="13" style="transform:rotate(90deg)"></span>
        <span class="cuenta-activos oculto" id="cuenta-filtros-activos">0</span>
      </button>
    </div>

    <div class="filtros-avanzados" id="filtros-avanzados">
      <div class="campo">
        <label>Registrado desde</label>
        <div class="campo-caja"><input id="filtro-desde" type="date" /></div>
      </div>
      <div class="campo">
        <label>Registrado hasta</label>
        <div class="campo-caja"><input id="filtro-hasta" type="date" /></div>
      </div>
      <div class="campo">
        <label>Saldo mínimo</label>
        <div class="campo-caja"><span style="color:var(--gold-soft);font-weight:700">S/</span><input id="filtro-saldo-min" type="number" min="0" step="0.01" placeholder="0.00" /></div>
      </div>
      <div class="campo">
        <label>Saldo máximo</label>
        <div class="campo-caja"><span style="color:var(--gold-soft);font-weight:700">S/</span><input id="filtro-saldo-max" type="number" min="0" step="0.01" placeholder="0.00" /></div>
      </div>
      <button class="btn btn-fantasma btn-sm" id="btn-limpiar-filtros" style="height:44px">Limpiar filtros</button>
    </div>

    <div class="tabla-envoltorio">
      <table class="tabla">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>DNI</th>
            <th>Teléfono</th>
            <th>Saldo</th>
            <th>Estado</th>
            <th>Registrado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
    <div id="paginacion-host"></div>
  </section>
</template>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
