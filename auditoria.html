<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaBank Admin — Auditoría</title>
<meta name="theme-color" content="#080F17" />
<link rel="icon" href="img/logo-banco.png" />
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
<div class="app-shell" id="app"></div>

<template id="tpl-auditoria">
  <section class="card card-pad reveal reveal-1">
    <div class="filtros-barra">
      <div class="campo-caja" style="max-width:300px;flex:1">
        <span data-icon="search"></span>
        <input id="buscar" type="text" placeholder="Buscar por usuario o acción…" />
      </div>
      <select class="select-filtro" id="filtro-categoria">
        <option value="">Todas las categorías</option>
        <option value="SESION">Sesión</option>
        <option value="NAVEGACION">Navegación</option>
        <option value="TRANSFERENCIA">Transferencia</option>
        <option value="PAGO_SERVICIO">Pago de servicio</option>
        <option value="RETIRO">Retiro</option>
        <option value="TARJETA">Tarjeta</option>
        <option value="QR">QR</option>
        <option value="PERFIL">Perfil</option>
        <option value="SEGURIDAD">Seguridad</option>
      </select>
      <button class="btn btn-fantasma btn-sm btn-filtros-avanzados" id="btn-toggle-avanzados">
        Filtros avanzados <span data-icon="chevron" data-size="13" style="transform:rotate(90deg)"></span>
        <span class="cuenta-activos oculto" id="cuenta-filtros-activos">0</span>
      </button>
    </div>

    <div class="filtros-avanzados" id="filtros-avanzados">
      <div class="campo">
        <label>Desde</label>
        <div class="campo-caja"><input id="filtro-desde" type="date" /></div>
      </div>
      <div class="campo">
        <label>Hasta</label>
        <div class="campo-caja"><input id="filtro-hasta" type="date" /></div>
      </div>
      <div class="campo">
        <label>Dirección IP</label>
        <div class="campo-caja"><span data-icon="activity"></span><input id="filtro-ip" type="text" placeholder="Ej. 10.28.103" /></div>
      </div>
      <label class="chk-campo"><input type="checkbox" id="filtro-solo-fallidos" /> Solo fallidos</label>
      <button class="btn btn-fantasma btn-sm" id="btn-limpiar-filtros" style="height:44px">Limpiar filtros</button>
    </div>

    <div class="tabla-envoltorio">
      <table class="tabla">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Acción</th>
            <th>Categoría</th>
            <th>Ubicación</th>
            <th>Resultado</th>
            <th>Fecha y hora</th>
          </tr>
        </thead>
        <tbody id="tabla-auditoria"></tbody>
      </table>
    </div>
    <div id="paginacion-host"></div>
  </section>
</template>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auditoria.js"></script>
</body>
</html>
