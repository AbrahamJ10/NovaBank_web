<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaBank Admin — Panel</title>
<meta name="theme-color" content="#080F17" />
<link rel="icon" href="img/logo-banco.png" />
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
<div class="app-shell" id="app"></div>

<template id="tpl-dashboard">
  <div class="kpis reveal reveal-1">
    <div class="card kpi">
      <div class="ico-kpi" style="background:rgba(201,162,39,.14);color:var(--gold-soft)" data-icon="users"></div>
      <div class="valor" id="kpi-total">0</div>
      <div class="etiqueta-kpi">Usuarios totales</div>
    </div>
    <div class="card kpi">
      <div class="ico-kpi" style="background:var(--verde-bg);color:var(--verde)" data-icon="check"></div>
      <div class="valor" id="kpi-activos">0</div>
      <div class="etiqueta-kpi">Cuentas activas</div>
    </div>
    <div class="card kpi">
      <div class="ico-kpi" style="background:var(--rojo-bg);color:var(--rojo)" data-icon="ban"></div>
      <div class="valor" id="kpi-suspendidos">0</div>
      <div class="etiqueta-kpi">Suspendidas</div>
    </div>
    <div class="card kpi">
      <div class="ico-kpi" style="background:var(--ambar-bg);color:var(--ambar)" data-icon="lock"></div>
      <div class="valor" id="kpi-bloqueados">0</div>
      <div class="etiqueta-kpi">Bloqueadas por intentos</div>
    </div>
  </div>

  <div class="kpis reveal reveal-2" style="margin-top:16px">
    <div class="card kpi">
      <div class="ico-kpi" style="background:var(--azul-info-bg);color:var(--azul-info)" data-icon="plus"></div>
      <div class="valor" id="kpi-nuevos">0</div>
      <div class="etiqueta-kpi">Nuevos registros hoy</div>
    </div>
    <div class="card kpi">
      <div class="ico-kpi" style="background:var(--verde-bg);color:var(--verde)" data-icon="key"></div>
      <div class="valor" id="kpi-logins">0</div>
      <div class="etiqueta-kpi">Inicios de sesión hoy</div>
    </div>
    <div class="card kpi">
      <div class="ico-kpi" style="background:var(--rojo-bg);color:var(--rojo)" data-icon="activity"></div>
      <div class="valor" id="kpi-logins-fallidos">0</div>
      <div class="etiqueta-kpi">Intentos fallidos hoy</div>
    </div>
    <div class="card kpi">
      <div class="ico-kpi" style="background:rgba(201,162,39,.14);color:var(--gold-soft)" data-icon="wallet"></div>
      <div class="valor" id="kpi-balance">S/ 0</div>
      <div class="etiqueta-kpi">Balance total en el banco</div>
    </div>
  </div>

  <div class="grid-2" style="margin-top:24px">
    <section class="card card-pad reveal reveal-3">
      <div class="seccion-titulo">
        <h3>Actividad reciente</h3>
        <a href="auditoria.html">Ver auditoría completa →</a>
      </div>
      <div class="linea-tiempo" id="actividad-reciente"></div>
    </section>

    <section class="card card-pad reveal reveal-4">
      <div class="seccion-titulo">
        <h3>Últimos inicios de sesión</h3>
        <a href="seguridad.html">Ver seguridad →</a>
      </div>
      <div id="logins-recientes"></div>
    </section>
  </div>
</template>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
